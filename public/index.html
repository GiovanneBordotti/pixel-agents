<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Agents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14121f" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>👾 Pixel Agents</h1>
    <div id="summary">
      <div class="stat"><span class="label">Agentes</span><span id="s-agents">0</span></div>
      <div class="stat"><span class="label">Trabalhando</span><span id="s-working">0</span></div>
      <div class="stat"><span class="label">Tokens totais</span><span id="s-total">0</span></div>
      <div class="stat"><span class="label">Output</span><span id="s-output">0</span></div>
    </div>
    <div id="controls">
      <button id="b-install" hidden title="Instalar como app">⬇️ Instalar app</button>
      <button id="b-notify" title="Notificações">🔕</button>
      <button id="b-sound" title="Som">🔊</button>
      <button id="b-aqua" title="Modo aquário: só a cidade">🐠</button>
      <button id="b-pip" hidden title="Fixar por cima das outras janelas">📌</button>
      <span id="conn" class="conn off">offline</span>
    </div>
  </header>
  <main>
    <section id="office-wrap">
      <canvas id="office"></canvas>
      <div id="overlay"></div>
      <p id="empty" hidden>A cidade está vazia. Abra um <code>claude</code> em qualquer projeto e mande uma mensagem: o morador aparece aqui.</p>
    </section>
    <aside id="panel"></aside>
  </main>
  <script src="app.js"></script>
  <script src="extras.js"></script>
</body>
</html>
